<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Songs for Noha</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Bricolage+Grotesque:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fbf5e9;
        --ink: #4a2a24;
        --soft: #8a6a62;
        --pink: #f2877e;
        --pink2: #e8665c;
        --lav: #a99bf0;
        --gold: #ffb347;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        background: var(--bg);
        overflow-x: hidden;
      }
      .glow {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(50% 40% at 12% 8%, #ffd9d3, transparent 70%),
          radial-gradient(50% 40% at 92% 30%, #e6defb, transparent 70%),
          radial-gradient(60% 45% at 30% 98%, #ffe5c7, transparent 70%), var(--bg);
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 98px 20px 60px;
      }
      .kick {
        font-size: 0.72rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--pink2);
        margin: 0 0 8px;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-style: italic;
        font-weight: 600;
        font-size: clamp(2.2rem, 10vw, 3.2rem);
        line-height: 1.02;
        margin: 0 0 26px;
      }
      .player {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 30px;
        padding: 26px 22px 22px;
        box-shadow: 0 14px 44px rgba(120, 70, 50, 0.12);
        text-align: center;
      }
      /* vinyl */
      .disc-wrap {
        position: relative;
        width: min(64vw, 250px);
        aspect-ratio: 1;
        margin: 4px auto 20px;
      }
      .disc-wrap::before {
        content: "";
        position: absolute;
        inset: -10%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--glowc, #f2877e55), transparent 68%);
        filter: blur(14px);
        z-index: 0;
      }
      .disc {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: repeating-radial-gradient(circle at 50% 50%, #1d1b1f 0 2px, #2a272e 2px 4px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        animation: spin 7s linear infinite;
        animation-play-state: paused;
      }
      .playing .disc {
        animation-play-state: running;
      }
      .disc::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 20deg,
          rgba(255, 255, 255, 0.14),
          transparent 20%,
          transparent 50%,
          rgba(255, 255, 255, 0.1) 70%,
          transparent 90%
        );
      }
      .label {
        position: absolute;
        inset: 31%;
        border-radius: 50%;
        background: var(--lg, linear-gradient(135deg, #f2877e, #a99bf0));
        background-size: cover;
        background-position: center;
        display: grid;
        place-items: center;
        font-family: "Fraunces", serif;
        font-style: italic;
        font-size: 1.6rem;
        color: #fff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25);
      }
      .label::after {
        content: "";
        position: absolute;
        width: 12%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #fbf5e9;
        box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.2);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .tt {
        font-family: "Fraunces", Georgia, serif;
        font-style: italic;
        font-weight: 600;
        font-size: 1.65rem;
        line-height: 1.1;
        margin: 0;
      }
      .ta {
        margin: 4px 0 18px;
        color: var(--soft);
      }
      /* seek */
      .seek {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.8rem;
        color: var(--soft);
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 22px;
        background: transparent;
        margin: 0;
        cursor: pointer;
        --p: 0%;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--pink) var(--p), #eadfd2 var(--p));
      }
      input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 6px;
        background: #eadfd2;
      }
      input[type="range"]::-moz-range-progress {
        height: 6px;
        border-radius: 6px;
        background: var(--pink);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid var(--pink);
        margin-top: -6px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid var(--pink);
      }
      input[type="range"]:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
        border-radius: 6px;
      }
      /* controls */
      .ctrl {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 14px 0 6px;
      }
      .cb {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 0;
        background: transparent;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.12s,
          background 0.2s;
      }
      .cb:active {
        transform: scale(0.92);
      }
      .cb:hover {
        background: rgba(242, 135, 126, 0.14);
      }
      .cb svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .cb.on {
        color: var(--pink2);
        background: rgba(242, 135, 126, 0.18);
      }
      .cb:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .play {
        width: 68px;
        height: 68px;
        background: linear-gradient(135deg, var(--pink), #ef6f86);
        color: #fff;
        box-shadow: 0 8px 22px rgba(232, 102, 92, 0.45);
      }
      .play:hover {
        background: linear-gradient(135deg, var(--pink), #ef6f86);
      }
      .play svg {
        width: 30px;
        height: 30px;
      }
      .vol {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        margin-top: 8px;
        color: var(--soft);
      }
      .vol svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .vol input {
        max-width: 150px;
      }
      /* list */
      .lh {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 34px 4px 10px;
      }
      .lh h2 {
        font-family: "Fraunces", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 1.6rem;
        margin: 0;
      }
      .lh span {
        color: var(--soft);
        font-size: 0.9rem;
      }
      .list {
        display: grid;
        gap: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        background: rgba(255, 255, 255, 0.62);
        border: 1px solid transparent;
        border-radius: 18px;
        padding: 10px 14px 10px 10px;
        cursor: pointer;
        font: inherit;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.15s,
          background 0.25s,
          border-color 0.25s;
      }
      .row:hover {
        background: rgba(255, 255, 255, 0.9);
      }
      .row:active {
        transform: scale(0.99);
      }
      .row:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .row.act {
        background: #fff;
        border-color: var(--pink);
        box-shadow: 0 8px 24px rgba(232, 102, 92, 0.16);
      }
      .thumb {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--lg);
        background-size: cover;
        background-position: center;
        display: grid;
        place-items: center;
        color: #fff;
        font-family: "Fraunces", serif;
        font-style: italic;
        font-size: 1.2rem;
        position: relative;
        overflow: hidden;
      }
      .eq {
        position: absolute;
        inset: 0;
        background: rgba(40, 20, 30, 0.55);
        display: none;
        align-items: flex-end;
        justify-content: center;
        gap: 3px;
        padding: 12px 0;
      }
      .row.act .eq {
        display: flex;
      }
      .eq i {
        width: 4px;
        border-radius: 2px;
        background: #fff;
        height: 30%;
        animation: eq 0.9s ease-in-out infinite alternate;
        animation-play-state: paused;
      }
      .playing .row.act .eq i {
        animation-play-state: running;
      }
      .eq i:nth-child(2) {
        animation-delay: -0.3s;
      }
      .eq i:nth-child(3) {
        animation-delay: -0.6s;
      }
      @keyframes eq {
        to {
          height: 90%;
        }
      }
      .rt {
        flex: 1;
        min-width: 0;
      }
      .rt b {
        display: block;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rt span {
        display: block;
        color: var(--soft);
        font-size: 0.88rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dur {
        color: var(--soft);
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }
      .empty {
        text-align: center;
        color: var(--soft);
        padding: 30px 10px;
        line-height: 1.7;
      }
      @media (prefers-reduced-motion: reduce) {
        .disc,
        .eq i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <main class="wrap" id="app">
      <p class="kick">Your playlist</p>
      <h1>Songs for Noha</h1>

      <section class="player" id="player" aria-label="Music player">
        <div class="disc-wrap">
          <div class="disc"><div class="label" id="lab"></div></div>
        </div>
        <p class="tt" id="tt">Pick a song</p>
        <p class="ta" id="ta">Tap any song below</p>
        <div class="seek">
          <span id="cur">0:00</span
          ><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" /><span
            id="tot"
            >0:00</span
          >
        </div>
        <div class="ctrl">
          <button class="cb" id="shuf" type="button" aria-label="Shuffle">
            <svg viewBox="0 0 24 24">
              <path
                d="M16 3h5v5l-2-2-4 4-1.4-1.4 4-4zM3 6h4.5l9 11H21l-2-2 1.4-1.4L24 17l-3.6 3.6L19 19.2l2-2h-5.5L6.5 8H3zM3 17h4l2.2-2.7 1.3 1.6L8 19H3z"
              />
            </svg>
          </button>
          <button class="cb" id="prev" type="button" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z" /></svg>
          </button>
          <button class="cb play" id="pp" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" id="pi"><path d="M7 4.5v15l13-7.5z" /></svg>
          </button>
          <button class="cb" id="next" type="button" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5l10.5 7L4 19z" /></svg>
          </button>
          <button class="cb" id="rep" type="button" aria-label="Repeat">
            <svg viewBox="0 0 24 24">
              <path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z" />
            </svg>
          </button>
        </div>
        <div class="vol">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" /></svg
          ><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume" />
        </div>
      </section>

      <div class="lh">
        <h2>All songs</h2>
        <span id="count"></span>
      </div>
      <div class="list" id="list"></div>
    </main>

    <audio id="au" preload="metadata"></audio>
    <script src="../playlist/songs.js"></script>
    <script>
      (function () {
        var L = (window.PLAYLIST || []).slice(),
          au = document.getElementById("au"),
          $ = function (i) {
            return document.getElementById(i);
          };
        var grads = [
          ["#f2877e", "#a99bf0"],
          ["#ffb347", "#f2877e"],
          ["#7fd1c4", "#a99bf0"],
          ["#f59bb5", "#ffcf70"],
          ["#8fb4f5", "#c9a7f0"],
          ["#ffcf70", "#8fd19a"],
        ];
        function G(i) {
          var g = grads[i % grads.length];
          return "linear-gradient(135deg," + g[0] + "," + g[1] + ")";
        }
        function F(f) {
          return "../playlist/" + encodeURI(f);
        }
        function lg(i) {
          var s = L[i];
          return s.cover ? 'url("' + F(s.cover) + '") center/cover' : G(i);
        }
        function T(t) {
          if (!isFinite(t)) t = 0;
          var m = Math.floor(t / 60),
            s = Math.floor(t % 60);
          return m + ":" + (s < 10 ? "0" : "") + s;
        }
        var cur = -1,
          shuf = false,
          rep = 0,
          order = [];
        $("count").textContent = L.length + (L.length === 1 ? " song" : " songs");
        if (!L.length) {
          $("list").innerHTML =
            '<p class="empty">No songs here yet.<br>Add your songs in <b>playlist/songs.js</b>.</p>';
          $("player").style.display = "none";
          return;
        }
        var list = $("list");
        L.forEach(function (s, i) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "row";
          b.id = "r" + i;
          b.innerHTML =
            '<span class="thumb" style="--lg:' +
            lg(i) +
            '">' +
            (s.cover ? "" : (s.title || "?").charAt(0).toUpperCase()) +
            '<span class="eq"><i></i><i></i><i></i></span></span><span class="rt"><b></b><span></span></span><span class="dur">&nbsp;</span>';
          b.querySelector(".rt b").textContent = s.title || "Untitled";
          b.querySelector(".rt span").textContent = s.artist || "";
          b.addEventListener("click", function () {
            if (cur === i) {
              toggle();
            } else {
              load(i, true);
            }
          });
          list.appendChild(b);
          var a = new Audio();
          a.preload = "metadata";
          a.src = F(s.file);
          a.addEventListener("loadedmetadata", function () {
            b.querySelector(".dur").textContent = T(a.duration);
          });
        });
        function show(i) {
          var s = L[i];
          $("tt").textContent = s.title || "Untitled";
          $("ta").textContent = s.artist || "";
          var lb = $("lab");
          lb.style.setProperty("--lg", lg(i));
          lb.textContent = s.cover ? "" : (s.title || "?").charAt(0).toUpperCase();
          document
            .querySelector(".disc-wrap")
            .style.setProperty("--glowc", grads[i % grads.length][0] + "66");
          document.querySelectorAll(".row").forEach(function (r, k) {
            r.classList.toggle("act", k === i);
          });
          if ("mediaSession" in navigator) {
            try {
              navigator.mediaSession.metadata = new MediaMetadata({
                title: s.title || "",
                artist: s.artist || "Noha",
                album: "Songs for Noha",
              });
            } catch (e) {}
          }
        }
        function load(i, play) {
          cur = i;
          au.src = F(L[i].file);
          show(i);
          if (play) au.play().catch(function () {});
        }
        function toggle() {
          if (cur < 0) {
            load(shuf ? Math.floor(Math.random() * L.length) : 0, true);
            return;
          }
          if (au.paused) au.play().catch(function () {});
          else au.pause();
        }
        function nxt(d) {
          if (cur < 0) {
            load(0, true);
            return;
          }
          var n;
          if (shuf && d > 0) {
            n = Math.floor(Math.random() * L.length);
            if (L.length > 1 && n === cur) n = (n + 1) % L.length;
          } else n = (cur + d + L.length) % L.length;
          load(n, true);
        }
        au.addEventListener("play", function () {
          document.body.classList.add("playing");
          $("pp").setAttribute("aria-label", "Pause");
          $("pi").innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
        });
        au.addEventListener("pause", function () {
          document.body.classList.remove("playing");
          $("pp").setAttribute("aria-label", "Play");
          $("pi").innerHTML = '<path d="M7 4.5v15l13-7.5z"/>';
        });
        au.addEventListener("ended", function () {
          if (rep === 2) {
            au.currentTime = 0;
            au.play();
          } else if (rep === 1 || shuf || cur < L.length - 1) nxt(1);
          else {
            au.currentTime = 0;
          }
        });
        au.addEventListener("loadedmetadata", function () {
          $("tot").textContent = T(au.duration);
        });
        var sk = $("seek"),
          drag = false;
        function paint() {
          var p = au.duration ? au.currentTime / au.duration : 0;
          if (!drag) sk.value = p * 1000;
          sk.style.setProperty("--p", p * 100 + "%");
          $("cur").textContent = T(au.currentTime);
        }
        au.addEventListener("timeupdate", paint);
        sk.addEventListener("input", function () {
          drag = true;
          sk.style.setProperty("--p", sk.value / 10 + "%");
          $("cur").textContent = T((au.duration * sk.value) / 1000);
        });
        sk.addEventListener("change", function () {
          if (au.duration) au.currentTime = (au.duration * sk.value) / 1000;
          drag = false;
        });
        $("pp").addEventListener("click", toggle);
        $("next").addEventListener("click", function () {
          nxt(1);
        });
        $("prev").addEventListener("click", function () {
          if (au.currentTime > 3) {
            au.currentTime = 0;
          } else nxt(-1);
        });
        $("shuf").addEventListener("click", function () {
          shuf = !shuf;
          this.classList.toggle("on", shuf);
        });
        $("rep").addEventListener("click", function () {
          rep = (rep + 1) % 3;
          this.classList.toggle("on", rep > 0);
          this.setAttribute("aria-label", ["Repeat off", "Repeat all", "Repeat one"][rep]);
          this.style.opacity = rep === 2 ? 1 : "";
          this.innerHTML =
            rep === 2
              ? '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z"/><text x="12" y="15.5" font-size="8" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">1</text></svg>'
              : '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>';
        });
        var v = $("vol");
        function pv() {
          au.volume = v.value / 100;
          v.style.setProperty("--p", v.value + "%");
        }
        v.addEventListener("input", pv);
        pv();
        if ("mediaSession" in navigator) {
          try {
            navigator.mediaSession.setActionHandler("previoustrack", function () {
              nxt(-1);
            });
            navigator.mediaSession.setActionHandler("nexttrack", function () {
              nxt(1);
            });
          } catch (e) {}
        }
        load(0, false);
      })();
    </script>
  </body>
</html>
